<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 30px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #ff0055; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        video { width: 100%; margin-top: 20px; border-radius: 8px; display: none; }
        #status { margin-top: 15px; color: #ffcc00; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Video Generator</h2>
    <input type="text" id="promptInput" placeholder="Jaise: Scary monster with glowing eyes under red moon...">
    <br>
    <button onclick="generateVideo()">Video Banayein</button>
    <p id="status"></p>
    <video id="videoResult" controls autoplay loop></video>
</div>

<script>
async function generateVideo() {
    const prompt = document.getElementById('promptInput').value;
    const status = document.getElementById('status');
    const video = document.getElementById('videoResult');
    
    if(!prompt) { alert("Pehle prompt likhein!"); return; }

    status.innerText = "Video request bhej rahe hain...";
    video.style.display = 'none';

    // Apni API Token yahan daalein
    const apiKey = r8_REQoC4Bupme3sNkziUbDP5Cf9ht0aAv4TtlLo 

    try {
        const response = await fetch("https://api.replicate.com/v1/predictions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                // Stability AI Stable Video Diffusion model
                version: "3f042780e227038e833f44535b6f3b06a461327c62d0d346ff2be79e831610e7",
                input: { prompt: prompt }
            })
        });

        const data = await response.json();
        if(data.error) {
            status.innerText = "Error: " + data.error;
            return;
        }

        status.innerText = "Video generate ho rahi hai, 1-2 minut wait karein...";
        checkStatus(data.id, apiKey);
    } catch (err) {
        status.innerText = "Error a gaya. API key check karein.";
    }
}

async function checkStatus(id, apiKey) {
    const checkInterval = setInterval(async () => {
        const res = await fetch(`https://api.replicate.com/v1/predictions/${id}`, {
            headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await res.json();

        if (data.status === "succeeded") {
            clearInterval(checkInterval);
            document.getElementById('status').innerText = "Video Tayar hai!";
            const videoElement = document.getElementById('videoResult');
            videoElement.src = Array.isArray(data.output) ? data.output[0] : data.output;
            videoElement.style.display = 'block';
        } else if (data.status === "failed") {
            clearInterval(checkInterval);
            document.getElementById('status').innerText = "Video nahi ban saki. Dobaara try karein.";
        }
    }, 4000);
}
</script>

</body>
</html>
